<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Polymarket Sports – Consistency Leaderboard (30d)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:1100px;margin:40px auto;padding:0 16px}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #eee;padding:8px 10px;text-align:left}
    th{position:sticky;top:0;background:#fff}
    .muted{color:#666}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
  </style>
</head>
<body>
  <h1>Sports Consistency Leaderboard (last 30 days)</h1>
  <p class="muted">Auto-updated every 6 hours by GitHub Actions.</p>
  <div id="meta" class="muted"></div>
  <table id="tbl">
    <thead>
      <tr>
        <th>#</th>
        <th>Wallet</th>
        <th>Trades (30d)</th>
        <th>Distinct Markets</th>
        <th>Last Trade</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function main(){
      const res = await fetch("data/consistency.json", { cache: "no-store" });
      const data = await res.json();
      document.getElementById("meta").textContent =
        `Generated ${new Date(data.generated_at).toLocaleString()} | Markets scanned: ${data.markets_scanned}`;

      const tbody = document.querySelector("#tbl tbody");
      data.rows.forEach((r, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${i+1}</td>
          <td class="mono">${r.wallet}</td>
          <td>${r.trades_30d}</td>
          <td>${r.distinct_markets_30d}</td>
          <td>${new Date(r.last_trade_ts*1000).toLocaleString()}</td>
        `;
        tbody.appendChild(tr);
      });
    }
    main().catch(err => {
      document.getElementById("meta").textContent = "Failed to load data: " + err.message;
    });
  </script>
</body>
</html>
