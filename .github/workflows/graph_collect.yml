name: Collect from The Graph

on:
  workflow_dispatch:
    inputs:
      fromTs:
        description: "From unix seconds (leave blank to auto: now-86400)"
        required: false
        default: ""
      toTs:
        description: "To unix seconds (leave blank to auto: now)"
        required: false
        default: ""
  schedule:
    - cron: "0 * * * *"   # hourly

concurrency:
  group: graph-collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    # For now we only collect fills. We'll add markets back after we map
    # the exact fields for that subgraph.
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: polymarket-fills
            id: EZCTgSzLPuBSqQcuR3ifeiKHKBnpjHSNbYpty8Mnjm9D
            query: queries/fills.graphql
            outfile: data/fills.jsonl

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine time window
        id: window
        shell: bash
        run: |
          # For cron: last 60 minutes
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            TO_TS=$(date +%s)
            FROM_TS=$((TO_TS - 3600))
          else
            # For manual runs, default to last 24h if left blank
            NOW=$(date +%s)
            FROM_TS="${{ github.event.inputs.fromTs }}"
            TO_TS="${{ github.event.inputs.toTs }}"
            [[ -z "$TO_TS"   ]] && TO_TS="$NOW"
            [[ -z "$FROM_TS" ]] && FROM_TS=$((TO_TS - 86400))
          fi
          echo "fromTs=$FROM_TS" >> $GITHUB_OUTPUT
          echo "toTs=$TO_TS"     >> $GITHUB_OUTPUT
          echo "Using window: $FROM_TS -> $TO_TS"

      - name: Ensure output folder
        run: mkdir -p data

      # Guard rails
      - name: Verify collector and queries exist
        run: |
          test -f collector/fetch_subgraph.cjs || { echo "Missing collector/fetch_subgraph.cjs"; exit 1; }
          test -f queries/fills.graphql        || { echo "Missing queries/fills.graphql"; exit 1; }

      - name: Run collector
        env:
          GRAPH_API_KEY: ${{ secrets.GRAPH_API_KEY }}
        run: |
          node collector/fetch_subgraph.cjs \
            --subgraph-id "${{ matrix.target.id }}" \
            --query-file "${{ matrix.target.query }}" \
            --out "${{ matrix.target.outfile }}" \
            --page 1000 \
            --var fromTs="${{ steps.window.outputs.fromTs }}" \
            --var toTs="${{ steps.window.outputs.toTs }}"

      - name: Upload data as artifact
        uses: actions/upload-artifact@v4
        with:
          name: graph-dump-${{ matrix.target.name }}
          path: ${{ matrix.target.outfile }}
          if-no-files-found: error
          retention-days: 7
